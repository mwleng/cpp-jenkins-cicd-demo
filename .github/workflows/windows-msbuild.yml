name: Windows MSBuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
          vs-version: '[17.0,18.0)'

      - name: Generate Visual Studio solution
        run: cmake -S . -B build-msbuild -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DFILECHECK_BUILD_TESTS=ON

      - name: Build Debug with MSBuild
        run: msbuild build-msbuild/cpp_filecheck.sln /m /p:Configuration=Debug /p:Platform=x64

      - name: Run CTest
        run: ctest --test-dir build-msbuild -C Debug --output-on-failure --no-tests=error

      - name: Build Release with MSBuild
        run: msbuild build-msbuild/cpp_filecheck.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Package Windows release
        run: cpack --config build-msbuild/CPackConfig.cmake -C Release -G ZIP -B dist

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: cpp-filecheck-windows-x64
          path: dist/*.zip
          if-no-files-found: error
